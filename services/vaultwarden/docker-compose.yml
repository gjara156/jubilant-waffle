services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    command: /start.sh
    volumes:
      - /mnt/slim/vaultwarden:/data
    ports:
      - "192.168.1.177:9010:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - vault-net

networks:
  vault-net:
    external: true
